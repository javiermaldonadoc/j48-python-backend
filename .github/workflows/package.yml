name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and inspect distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Check release metadata consistency
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          import tomllib
          from pathlib import Path

          with open("pyproject.toml", "rb") as stream:
              version = tomllib.load(stream)["project"]["version"]

          module = ast.parse(Path("j48/__init__.py").read_text())
          module_version = next(
              node.value.value
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)
              and isinstance(node.value, ast.Constant)
              and isinstance(node.value.value, str)
          )
          if module_version != version:
              raise SystemExit(
                  f"j48.__version__ {module_version!r} does not match project.version {version!r}"
              )

          changelog = Path("CHANGELOG.md").read_text()
          if re.search(rf"^## \[{re.escape(version)}\](?:\s|$)", changelog, re.MULTILINE) is None:
              raise SystemExit(f"CHANGELOG.md has no section for {version!r}")

          expected_tag = f"v{version}"
          if os.environ["IS_TAG"] == "true" and os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(
                  f"tag {os.environ['RELEASE_TAG']!r} does not match {expected_tag!r}"
              )
          print(f"release metadata agrees on version {version}")
          PY
      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/j48-wheel-test
          /tmp/j48-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/j48-wheel-test/bin/python - <<'PY'
          import numpy as np
          from importlib.metadata import version

          import j48
          from j48 import J48Classifier, J48FastClassifier

          assert j48.__version__ == version("j48-python-backend")

          X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], dtype=float)
          y = np.array([0, 0, 1, 1])
          for estimator_type in (J48Classifier, J48FastClassifier):
              estimator = estimator_type().fit(X, y)
              assert estimator.predict(X).tolist() == y.tolist()
          print("wheel smoke test: OK")
          PY
      - name: Install and smoke-test source distribution
        run: |
          python -m venv /tmp/j48-sdist-test
          /tmp/j48-sdist-test/bin/python -m pip install dist/*.tar.gz
          cd /tmp
          /tmp/j48-sdist-test/bin/python - <<'PY'
          import numpy as np
          from importlib.metadata import version

          import j48
          from j48 import J48Classifier, J48FastClassifier

          assert j48.__version__ == version("j48-python-backend")

          X = np.array([[0, 0], [0, 1], [1, 0], [1, 1]], dtype=float)
          y = np.array([0, 0, 1, 1])
          for estimator_type in (J48Classifier, J48FastClassifier):
              estimator = estimator_type().fit(X, y)
              assert estimator.predict(X).tolist() == y.tolist()
          print("source distribution smoke test: OK")
          PY
      - name: Generate artifact checksums
        working-directory: dist
        run: sha256sum -- *.whl *.tar.gz > SHA256SUMS
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: prepare GitHub release draft
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "j48-python-backend ${RELEASE_TAG#v}" \
            --draft \
            --generate-notes \
            --verify-tag
